name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Runs the exact acceptance gate (scripts/verify.sh): containerized PostgreSQL via
    # Testcontainers and the production image gate on the runner's Docker. Skips are refused in CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm # dependency store only; no build outputs or secrets
      - name: Install pinned, checksum-verified scanners
        run: bash scripts/install-scanners.sh
      - name: Install Playwright browser
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Acceptance verification (all gates)
        run: |
          mkdir -p reports
          set -o pipefail
          bash scripts/verify.sh 2>&1 | tee reports/verify.log
      - name: Upload verification log and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-${{ github.run_id }}-${{ github.run_attempt }}
          # Logs are allow-listed and redacted at source; no env dumps, .env files, or database files.
          path: |
            reports/
          retention-days: 30
          if-no-files-found: warn
